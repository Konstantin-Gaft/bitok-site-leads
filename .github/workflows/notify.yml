name: site-leads-tg
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-leads
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 notify.py
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: save state
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "site-leads-bot"; git config user.email "site-leads-bot@users.noreply.github.com"
            git add seen.json && git commit -m "seen" && git push
          fi
